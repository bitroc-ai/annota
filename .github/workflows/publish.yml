name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.2.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if src/ has changes
        id: check_changes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release, proceeding with publish"
            echo "has_src_changes=true" >> $GITHUB_OUTPUT
          else
            # Check if src/ has changes between tags
            CHANGES=$(git diff --name-only ${PREV_TAG}..HEAD -- src/ package.json)

            if [ -z "$CHANGES" ]; then
              echo "No changes detected in src/ or package.json"
              echo "has_src_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Changes detected in: ${CHANGES}"
              echo "has_src_changes=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Stop if no src changes
        if: steps.check_changes.outputs.has_src_changes == 'false'
        run: |
          echo "::warning::No changes in src/ or package.json. Skipping publish."
          echo "This tag appears to be for documentation or other non-package changes."
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js for library compatibility
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build package
        run: pnpm build

      - name: Run browser lifecycle integration tests
        run: pnpm test:browser

      - name: Run framework lifecycle integration tests
        run: pnpm test:frameworks

      - name: Verify isolated packed consumers
        run: pnpm test:consumer

      - name: Run benchmark regression gate
        run: pnpm benchmark:ci

      - name: Setup Node.js for documentation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RAW_GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VERSION="$RAW_DISPATCH_VERSION"
          else
            RAW_VERSION="${RAW_GITHUB_REF#refs/tags/v}"
          fi

          export RELEASE_VERSION_CANDIDATE="$RAW_VERSION"
          VERSION=$(node scripts/validate-release-version.mjs)

          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            printf 'PRERELEASE=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'PRERELEASE=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: node scripts/validate-release-package-version.mjs

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits that touched src/ or package.json
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -- src/ package.json)
          else
            # Get commits between tags that touched src/ or package.json
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges -- src/ package.json)
          fi

          CHANGELOG_FILE="docs/src/content/docs/changelog.mdx"
          printf '%s\n' "$CHANGELOG" | node scripts/generate-changelog.mjs \
            --version "$RELEASE_VERSION" \
            --file "$CHANGELOG_FILE"

          # Save changelog content for GitHub release
          echo "CHANGELOG_CONTENT<<EOF" >> "$GITHUB_OUTPUT"
          echo "${CHANGELOG}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate final documentation imports
        run: pnpm check:docs-imports

      - name: Build documentation with final changelog
        run: pnpm --dir docs build

      - name: Commit changelog to docs
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          CHANGELOG_FILE="docs/src/content/docs/changelog.mdx"
          if git diff --quiet -- "$CHANGELOG_FILE"; then
            echo "Changelog is already up to date; nothing to commit."
          else
            git add "$CHANGELOG_FILE"
            git commit -m "docs: add changelog for v${RELEASE_VERSION}"
            git push origin HEAD:main
          fi

      - name: Verify npm auth and package ownership
        run: |
          NPM_USER=$(npm whoami)
          echo "Authenticated npm user: ${NPM_USER}"

          OWNER_USERS=$(npm owner ls annota | awk '{print $1}')
          echo "annota owners:"
          echo "${OWNER_USERS}"

          if ! echo "${OWNER_USERS}" | grep -Fxq "${NPM_USER}"; then
            echo "::error::NPM_TOKEN authenticates as '${NPM_USER}', which is not an owner of 'annota'."
            echo "::error::Use an npm token from an annota owner account (currently includes: ${OWNER_USERS})."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          release_name: Release ${{ env.RELEASE_VERSION }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

            ## Installation

            ```bash
            npm install annota@${{ env.RELEASE_VERSION }}
            # or
            pnpm add annota@${{ env.RELEASE_VERSION }}
            ```

            See the [full changelog](https://annota.bitroc.ai/docs/changelog) for more details.
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
