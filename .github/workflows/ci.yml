name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build
      - run: pnpm test:browser
      - run: pnpm test:frameworks
      - run: pnpm test:consumer
      - run: pnpm benchmark:ci
      - run: pnpm --dir docs build
